<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 768px; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background: radial-gradient(120% 100% at 12% 0%, #26282b 0%, #1a1b1d 55%, #151617 100%);
    color: #e9eaec;
    display: grid;
    grid-template-columns: 478px 1fr;
    align-items: center;
    gap: 40px;
    padding: 56px 60px;
    overflow: hidden;
  }

  /* ── 左栏：品牌 ───────────────────────────── */
  .brand-row { display: flex; align-items: center; gap: 20px; }
    .icon {
    width: 92px; height: 92px; border-radius: 21px;
    background: #fff; padding: 6px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
  }
  .icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: .3px; line-height: 1.15; white-space: nowrap; }
  .en { margin-top: 7px; font-size: 15px; color: #7f868d; letter-spacing: 1.4px; }

  .lede {
    margin-top: 42px; font-size: 24px; line-height: 1.6; color: #c3c7cc;
  }
  .lede b { color: #f0c274; font-weight: 600; }

  .points { margin-top: 38px; display: flex; flex-direction: column; gap: 17px; }
  .point { display: flex; align-items: center; gap: 12px; font-size: 18px; color: #a8aeb5; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #e0a458; flex: none; }

  /* ── 右栏：同步结果示意 ─────────────────────── */
  .flow { display: flex; align-items: center; gap: 22px; }
  .arrow { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .arrow .line { width: 2px; height: 0; }
  .arrow svg { display: block; }
  .arrow span { font-size: 12.5px; color: #6f767d; letter-spacing: 1px; }

  .doc {
    flex: 1;
    background: #232527;
    border: 1px solid #33373a;
    border-radius: 14px;
    box-shadow: 0 22px 48px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .doc-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 18px; background: #1d1f21; border-bottom: 1px solid #303436;
  }
  .doc-bar i { width: 9px; height: 9px; border-radius: 50%; background: #3a3f42; display: block; }
  .doc-title { margin-left: 8px; font-size: 14.5px; color: #9aa1a8; }
  .doc-body { padding: 22px 24px 26px; }
  .doc-h { font-size: 21px; font-weight: 600; margin-bottom: 20px; color: #f0f1f2; }

  .hl { display: flex; gap: 12px; margin-bottom: 18px; }
  .hl .bar { width: 3px; border-radius: 2px; background: #e0a458; flex: none; }
  .hl .txt { font-size: 15.5px; line-height: 1.65; color: #c9ced3; }
  .hl .txt em { font-style: normal; background: rgba(224,164,88,.16); padding: 0 3px; border-radius: 3px; }
  .note {
    margin: 10px 0 0 14px; padding-left: 12px; border-left: 2px solid #3a3f42;
    font-size: 14px; color: #8d949b; line-height: 1.55;
  }
  .tags { margin-top: 9px; display: flex; gap: 7px; }
  .tag { font-size: 11.5px; color: #8bb7c9; background: rgba(139,183,201,.12); padding: 2px 8px; border-radius: 10px; }
</style>
</head>
<body>
  <div>
    <div class="brand-row">
      <div class="icon"><img src="{{ICON}}" alt=""></div>
      <div>
        <h1>Acorny 高亮同步</h1>
        <div class="en">ACORNY SYNC FOR SIYUAN</div>
      </div>
    </div>

    <p class="lede">把 <b>Acorny</b> 里读到的高亮<br>单向同步进<b>思源笔记</b></p>

    <div class="points">
      <div class="point"><span class="dot"></span>对账式同步，删掉的文档会自动重建</div>
      <div class="point"><span class="dot"></span>块属性去重，重复同步不会产生副本</div>
      <div class="point"><span class="dot"></span>只追加，绝不覆盖你在文档里的编辑</div>
    </div>
  </div>

  <div class="flow">
    <div class="arrow">
      <svg width="34" height="16" viewBox="0 0 34 16" fill="none">
        <path d="M0 8h27" stroke="#4d5357" stroke-width="2"/>
        <path d="M26 2l7 6-7 6" stroke="#e0a458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>SYNC</span>
    </div>

    <div class="doc">
      <div class="doc-bar">
        <i></i><i></i><i></i>
        <span class="doc-title">/Acorny / 人性的弱点</span>
      </div>
      <div class="doc-body">
        <div class="doc-h">人性的弱点</div>

        <div class="hl">
          <div class="bar"></div>
          <div class="txt">
            <em>批评毫无用处，它只会让对方竖起防卫的高墙</em>，并千方百计为自己辩解。
            <div class="tags"><span class="tag">#沟通#</span><span class="tag">#人际#</span></div>
          </div>
        </div>

        <div class="hl">
          <div class="bar"></div>
          <div class="txt">
            <em>要让别人做成一件事，唯一的办法是让他自己想去做。</em>
            <div class="note">note: 内在动机 &gt; 外部驱动，管理和育儿都适用</div>
          </div>
        </div>

        <div class="hl">
          <div class="bar"></div>
          <div class="txt"><em>人们最渴望的，是被真诚地看见与认可。</em></div>
        </div>

        <div class="hl">
          <div class="bar"></div>
          <div class="txt">
            <em>与其争辩输赢，不如让对方觉得这个主意是他自己想出来的。</em>
            <div class="tags"><span class="tag">#说服#</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
